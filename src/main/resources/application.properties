spring.application.name=wordwang

# File-based H2 database (data persists under ./data)
spring.datasource.url=jdbc:h2:file:./data/wordwang;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console, available at /h2-console when the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
