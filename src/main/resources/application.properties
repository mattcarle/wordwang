spring.application.name=wordwang
server.port=8081

# The browser-visible path prefix this app is deployed under (see carle7-edge's Caddyfile) - the
# session and CSRF cookies (see admin/config/SecurityConfig) are scoped to it so this app's admin
# login doesn't clobber, or get clobbered by, another app's cookies sharing the same domain.
app.base-path=/wordwang
server.servlet.session.cookie.path=${app.base-path}

# Behind carle7-edge + this app's own Caddy (see docker-compose.yml), the connection Tomcat sees
# is always from the inner Caddy container, not the real player - resolve request.getRemoteAddr()
# from X-Forwarded-For instead so IP capture for the audit trail (see the audit package) records
# the real client IP.
server.forward-headers-strategy=framework

# File-based H2 database (data persists under ./data)
spring.datasource.url=jdbc:h2:file:./data/wordwang;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console, available at /h2-console when the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
