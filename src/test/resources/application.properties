# Tests get their own in-memory database instead of the dev file DB (./data/wordwang) so a test
# run never pollutes real high scores or leaves behind a real admin credential row.
spring.datasource.url=jdbc:h2:mem:wordwang-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# src/test/resources/application.properties replaces (not merges with) the main one, so
# app.base-path must be redeclared here. The real app scopes both the session cookie
# (server.servlet.session.cookie.path, derived from this below) and the CSRF cookie
# (SecurityConfig's ${app.base-path}) to /wordwang because that's the path the browser actually
# sees in production. Tests hit the backend directly with no such prefix, so an HTTP client's
# cookie jar would refuse to send a /wordwang-scoped cookie back on a request to /api/admin/... -
# unscope both here to match how tests actually address the app.
app.base-path=/
